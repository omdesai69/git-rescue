[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-rescue-cli"
version = "0.1.1"
description = "Zero-dependency Git disaster recovery CLI tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Om Desai", email = "omdesai608@gmail.com" },
]
keywords = ["git", "recovery", "reflog", "undo", "cli", "disaster-recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
git-rescue = "git_rescue.cli:cli_entry"

[project.urls]
Homepage = "https://github.com/omdesai69/git-rescue"
Repository = "https://github.com/omdesai69/git-rescue"
Issues = "https://github.com/omdesai69/git-rescue/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["git_rescue"]

[tool.hatch.build.targets.sdist]
include = [
    "/git_rescue",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

