[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-rescue"
version = "0.1.0"
description = "Zero-dependency Git disaster recovery CLI tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Om Desai" },
]
keywords = ["git", "recovery", "reflog", "undo", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
# README's development instructions are `pip install -e ".[dev]"`, which fails
# without this table. The runtime stays zero-dependency (ADR-0001); this is
# test-time only.
dev = [
    "pytest>=7.0",
]

[project.scripts]
git-rescue = "git_rescue.cli:cli_entry"

[project.urls]
Homepage = "https://github.com/omdesai/git-rescue"
Repository = "https://github.com/omdesai/git-rescue"
Issues = "https://github.com/omdesai/git-rescue/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["git_rescue"]
